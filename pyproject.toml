[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adguard-rules-merger"
version = "6.1.0"
description = "Merge, deduplicate and export AdGuard Home DNS filter lists"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kekai2020" }]
dependencies = [
  "aiohttp>=3.9.0",
  "PyYAML>=6.0",
  "pydantic>=2.5.0",
  "tldextract>=5.0.0",
  "typer>=0.9.0",
  "rich>=13.7.0",
  "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
adguard-rules-merger = "merge_rules:app"

[tool.setuptools]
py-modules = ["config_loader", "merge_rules"]

[tool.setuptools.packages.find]
include = ["merger*"]
