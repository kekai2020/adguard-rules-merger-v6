# AdGuard Rules Merger V6 — Source configuration
# 18 sources with explicit categories (fixes V4 tiered-output bug).
# Updated: 2026-09-22

# ── Global merge settings ──────────────────────────────────────────
timeout: 120
max_concurrency: 50
# Abort if more than 50% of enabled sources fail to download.
fail_threshold: 0.5
# Optional: diff against the previous domains.txt (set to e.g. output/domains.txt).
diff_against: null

# ── Download settings ─────────────────────────────────────────────
download:

  retry_count: 2
  retry_delay: 1.5
  # V5.2: hard per-source time budget (all retries combined, seconds).
  # A dead source falls back to its stale cache after this budget instead of
  # burning (retry_count+1) × timeout ≈ 6 minutes of wall time. 0 = unlimited.
  source_deadline: 120

# ── Dedup settings ──────────────────────────────────────────────────
# V5: lowercasing and trailing-dot removal are ALWAYS applied (not configurable).
# Only www-stripping is optional.
dedup:
  strip_www: true

# ── Quality filter settings ─────────────────────────────────────────
quality_filter:
  enabled: true
  min_domain_length: 4
  max_domain_length: 253
  filter_localhost: true
  filter_ip_rules: false

# ── Aggregation settings ────────────────────────────────────────────
aggregation:
  enabled: true
  min_aggregator_labels: 2
  # V5: fold ||*.sub.example.com^ under ||*.example.com^ / ||example.com^
  wildcard_child_aggregation: true
  # V5: promote N exact sibling subdomains to one ||*.parent^ (0 = off, conservative).
  # Raise to e.g. 100 only if you accept slightly wider blocking to shrink the list.
  wildcard_promotion_threshold: 0

# ── Conflict resolution settings ────────────────────────────────────
conflict_resolution:
  enabled: true
  # V5: this flag now genuinely controls @@||A^ cascading to subdomains.
  cascade_subdomains: true

# ── Whitelist threat-intel audit (optional) ─────────────────────────
# Disabled by default: the network layers add latency and hit third-party APIs.
# Enable locally or via VIRUSTOTAL_API_KEY / OPENAI_API_KEY env vars.
whitelist_audit:
  enabled: true
  concurrency: 20
  # Layer 1: DNS resolution (free, keyless)
  use_dns: true
  # Layer 2: Threat intelligence (free, keyless)
  use_urlhaus: true
  use_threatfox: true
  urlhaus_delay: 0.2
  # Layer 3: RDAP domain age check (free, keyless)
  # Flags domains registered < new_domain_threshold_days as suspicious
  use_rdap: true
  new_domain_threshold_days: 30
  # Layer 4: MarketNow scam/phishing check (free, keyless)
  # Detects typosquatting, suspicious TLD, punycode, unregistered domains
  use_scam_check: true
  # Layer 5: DNSBL blocklists (V5.2, free, keyless DNS queries)
  # Spamhaus DBL + SURBL — malware/phishing listings = malicious,
  # spam/junk/abused listings = suspicious
  use_dnsbl: true
  # V5.2: persist audit results 24h (cache/whitelist_audit_cache.json) so
  # repeated runs skip network lookups for unchanged whitelist domains
  cache_results: true
  # Layer 6: VirusTotal (optional, requires API key)
  use_virustotal: false
  virustotal_api_key: ""
  # Layer 7 (offline) + Layer 8: AI / LLM classification (optional, requires API key)
  # Only called for domains where offline confidence < ai.min_confidence
  ai:
    enabled: false
    api_key: ""
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"
    min_confidence: 0.6
    max_domains: 100

# V5: graded whitelist output (requires whitelist_audit.enabled=true)
# Splits whitelist.txt into sub-files by rating and category.
whitelist_output:
  enabled: true
  by_rating: true            # whitelist_safe.txt, whitelist_suspicious.txt, ...
  by_category: true          # whitelist_by_category/<rating>_<category>.txt
  include_all_ratings: false # only split "safe" by category by default
  categories: []             # empty = all 9 categories; or list e.g. [advertising, cdn]

# ── Cache settings (ETag + SHA256, compatible with actions/cache) ──
cache:
  enabled: true
  directory: cache
  ttl_seconds: 0
  max_size_mb: 500

# ── Output settings ────────────────────────────────────────────────
output:
  directory: output
  formats:
    - adguard
    - whitelist
  tiered: true
  report: true
  write_diff: false

