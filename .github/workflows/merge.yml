name: Merge Rules (V6)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'merger/**'
      - 'tests/**'
      - 'merge_rules.py'
      - 'config_loader.py'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m pytest tests/ -q --tb=short

  merge:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config
        run: python merge_rules.py validate config/sources.yaml

      - name: Restore rule cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: rule-cache-v6-${{ hashFiles('config/sources.yaml', 'merger/**', 'merge_rules.py') }}
          restore-keys: |
            rule-cache-v6-

      - name: Run merge
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "::group::Merge Output"
          python merge_rules.py merge --config config/sources.yaml
          echo "::endgroup::"

      - name: Verify output
        run: |
          echo "Output files:"
          ls -la output/ 2>/dev/null || echo "ERROR: output/ directory missing!"
          test -f output/merged_rules.txt || (echo "ERROR: merged_rules.txt not found" && exit 1)
          echo "merged_rules.txt lines: $(wc -l < output/merged_rules.txt)"
          grep -q '^! Version:' output/merged_rules.txt

      - name: Commit subscription files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Subscription lists only — reports/json carry wall-clock fields.
          git add -f output/*.txt output/*.yaml output/*.list output/*.conf \
                     output/whitelist_by_category 2>/dev/null || true
          echo "=== staged changes ==="
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No subscription-file changes — skipping commit"
          else
            git commit -m "Auto-merge: update rules $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || git pull --rebase --autostash origin main
            git push origin main
            echo "Push successful"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-rules-v6
          path: output/
          retention-days: 30
