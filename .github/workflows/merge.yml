name: Merge Rules (V6)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'merger/**'
      - 'tests/**'
      - 'merge_rules.py'
      - 'config_loader.py'
      - 'requirements.txt'
      - '.github/workflows/**'

# 防止并发运行造成 git 冲突
concurrency:
  group: merge-rules-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m pytest tests/ -q --tb=short

  merge:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate config
        run: python merge_rules.py validate config/sources.yaml

      - name: Restore rule cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: rule-cache-v6-${{ hashFiles('config/sources.yaml', 'merger/**', 'merge_rules.py', 'requirements.txt') }}
          restore-keys: |
            rule-cache-v6-
            rule-cache-v5-

      - name: Run merge
        env:
          PYTHON_JIT: "1"              # 启用 JIT（3.13 实验性）      
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "::group::Merge Output"
          python merge_rules.py merge --config config/sources.yaml
          echo "::endgroup::"

      - name: Verify output
        run: |
          echo "=== Output directory ==="
          ls -la output/ 2>/dev/null || (echo "ERROR: output/ directory missing!" && exit 1)

          echo ""
          echo "=== Required files (minimal) ==="
          for f in merged_rules.txt whitelist.txt stats.json; do
            if [ -f "output/$f" ]; then
              size=$(stat -c%s "output/$f")
              echo "✓ $f ($(numfmt --to=iec $size))"
            else
              echo "✗ $f MISSING"
              exit 1
            fi
          done

          echo ""
          echo "merged_rules.txt lines: $(wc -l < output/merged_rules.txt)"
          grep -q '^! Version:' output/merged_rules.txt || (echo "ERROR: missing Version header" && exit 1)

          echo ""
          echo "=== Stats summary ==="
          python -c "import json; s=json.load(open('output/stats.json')); print(f\"block={s['rules']['block']:,} allow={s['rules']['allow']:,} raw={s['rules']['before']:,} dedup={s['rules']['dedup_rate']}%\")"

          echo ""
          echo "=== All generated files ==="
          ls -1 output/
          
      - name: Commit subscription files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 只提交订阅文件 — 报告/JSON 含墙钟时间戳
          git add -f output/*.txt output/*.yaml output/*.list output/*.conf 2>/dev/null || true
          if [ -d output/whitelist_by_category ]; then
            git add -f output/whitelist_by_category/ 2>/dev/null || true
          fi

          echo "=== Staged changes ==="
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No subscription-file changes — skipping commit"
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 从 stats.json 提取摘要，作为提交信息的一部分
          SUMMARY=$(python -c "import json; s=json.load(open('output/stats.json')); print(f\"block={s['rules']['block']:,} allow={s['rules']['allow']:,}\")" 2>/dev/null || echo "")

          git commit -m "Auto-merge: update rules [${SUMMARY}] $(date -u +'%Y-%m-%d %H:%M UTC')"

          # push 失败重试（最多 3 次）
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Push successful (attempt $i)"
              echo "committed=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

          echo "ERROR: Push failed after 3 attempts — check branch protection rules"
          echo "committed=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### Merge Rules V6 Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f output/stats.json ]; then
            python -c "
          import json
          s = json.load(open('output/stats.json'))
          print(f'| Metric | Value |')
          print(f'|--------|-------|')
          print(f'| Raw rules | {s[\"rules\"][\"before\"]:,} |')
          print(f'| Block rules | {s[\"rules\"][\"block\"]:,} |')
          print(f'| Allow rules | {s[\"rules\"][\"allow\"]:,} |')
          print(f'| Dedup rate | {s[\"rules\"][\"dedup_rate\"]}% |')
          print(f'| Sources OK | {s[\"sources\"][\"ok\"]}/{s[\"sources\"][\"total\"]} |')
          print(f'| Elapsed | {s[\"elapsed_seconds\"]}s |')
          " >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Committed: ${{ steps.commit.outputs.committed }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-rules-v6
          path: output/
          retention-days: 90
          compression-level: 6
